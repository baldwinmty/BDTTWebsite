<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contact | Bronze Dragon Tabletop</title>
    <meta
      name="description"
      content="Contact Bronze Dragon Tabletop about games, events, and miniature painting."
    >
    <link rel="stylesheet" href="assets/css/styles.css?v=20260707-spectral">
    <link rel="icon" type="image/png" href="assets/images/bronze-dragon-logo.png">
    <link rel="apple-touch-icon" href="assets/images/bronze-dragon-logo.png">
  </head>
  <body data-page="contact">
    <header class="site-header">
      <a class="brand" href="index.html" aria-label="Bronze Dragon Tabletop home">
        <span class="brand-mark"><img src="assets/images/bronze-dragon-logo.png" alt="" aria-hidden="true"></span>
        <span>Bronze Dragon Tabletop</span>
      </a>
      <nav class="nav-links" aria-label="Primary navigation">
        <a href="index.html">Home</a>
        <a href="book-a-game.html">Private Games</a>
        <a href="upcoming-events.html">Upcoming Events</a>
        <a href="miniatures.html">Miniatures</a>
        <a href="about.html">About Me</a>
        <a aria-current="page" href="contact.html">Contact</a>
      </nav>
    </header>

    <main>
      <section class="page-hero" aria-labelledby="page-title">
        <p class="eyebrow"></p>
        <h1 id="page-title">Contact Me</h1>
        <p class="lede">
          Got another question or request that my booking form doesn't cover? Shoot me a message here.
        </p>
      </section>

      <section class="section form-section" aria-label="Contact form">
        <form class="contact-form" data-contact-form action="#" method="post">
          <label for="name">Name</label>
          <input id="name" name="name" type="text" autocomplete="name" required>

          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required>

          <label for="topic">Topic</label>
          <select id="topic" name="topic" required>
            <option value="">Choose a topic</option>
            <option value="book-a-game">Private Games</option>
            <option value="event">Upcoming Events</option>
            <option value="miniatures">Miniatures</option>
            <option value="other">Other</option>
          </select>

          <label for="message">Message</label>
          <textarea id="message" name="message" rows="7" required></textarea>

          <button class="button primary" type="submit">Send Message</button>
          <p class="form-note" data-form-note>
            Thank you!
          </p>
        </form>
      </section>
    </main>

    <footer class="site-footer">
      <p>Bronze Dragon Tabletop LLC</p>
      <p>Adults must find time for play, too!</p>
    </footer>

    <script src="assets/js/main.js?v=20260707-formspree"></script>
  </body>
</html>
